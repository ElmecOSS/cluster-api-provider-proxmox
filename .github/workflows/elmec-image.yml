# Elmec fork only — on-demand image build for any ref, pushed to
# ghcr.io/elmecoss/capmox with a traceable <ref-slug>-<shortsha> tag.
# Lives on the `elmec-main` default branch so upstream-bound PR branches
# never carry it. Trigger:
#   gh workflow run elmec-image -f ref=feat/my-branch
name: elmec-image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch o SHA da buildare (es. feat/failure-domains)"
        required: true
        default: "main"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image tag
        id: meta
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          slug=$(echo "$INPUT_REF" | tr '/_' '--' | tr -cd 'a-zA-Z0-9.-' | cut -c1-100)
          echo "tag=ghcr.io/elmecoss/capmox:${slug}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tag }}

      - name: Print image reference
        run: echo "Pushed ${{ steps.meta.outputs.tag }}"
