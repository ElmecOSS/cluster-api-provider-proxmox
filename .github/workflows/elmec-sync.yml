# Elmec fork only — keeps the `main` branch a fast-forward mirror of
# ionos-cloud/cluster-api-provider-proxmox. Lives on the `elmec-main`
# default branch so that upstream-bound PR branches (cut from `main`)
# never carry this file. Fails loudly (no merge commit) if main diverges.
#
# Pushing commits that touch `.github/workflows/*` is refused for the
# built-in GITHUB_TOKEN regardless of the `permissions` block, so the push
# uses ELMEC_SYNC_TOKEN when present: a fine-grained PAT scoped to this
# repository with Contents and Workflows set to read/write (see
# docs/elmec-fork.md). Without it the run still fast-forwards until
# upstream changes a workflow file, then fails with an explicit message.
name: elmec-sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.ELMEC_SYNC_TOKEN || github.token }}

      - name: Fast-forward main from upstream
        env:
          HAS_SYNC_TOKEN: ${{ secrets.ELMEC_SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ionos-cloud/cluster-api-provider-proxmox.git
          git fetch upstream main

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/main)" ]; then
            echo "main is already in sync with upstream/main"
            exit 0
          fi

          if [ "$HAS_SYNC_TOKEN" != "true" ] \
             && ! git diff --quiet HEAD upstream/main -- .github/workflows; then
            echo "::error::upstream changed .github/workflows/* and ELMEC_SYNC_TOKEN is not set:" \
                 "GITHUB_TOKEN cannot push workflow changes. Add the secret (docs/elmec-fork.md)" \
                 "or fast-forward main by hand: git push origin upstream/main:main"
            exit 1
          fi

          git merge --ff-only upstream/main
          git push origin main
