# Elmec fork only — keeps the `main` branch a fast-forward mirror of
# ionos-cloud/cluster-api-provider-proxmox. Lives on the `elmec-main`
# default branch so that upstream-bound PR branches (cut from `main`)
# never carry this file. Fails loudly (no merge commit) if main diverges.
name: elmec-sync

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main from upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ionos-cloud/cluster-api-provider-proxmox.git
          git fetch upstream main
          git merge --ff-only upstream/main
          git push origin main
